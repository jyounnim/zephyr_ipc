# 03_SHM_RACE_LAB - core0 (procpu) image
#
# This lab's real teaching content: reusing the existing ipmmem0 shared
# SRAM block (already reserved by &ipm0/&mbox0 in the SoC devicetree) to
# pass a small struct directly between cores, with &mbox0 used purely as
# a signal-only "new data available" doorbell (see src/shared_mem.h and
# the doc for the full design and the race condition this lab reproduces).
#
# NOTE: &ipm0 is intentionally left DISABLED here - see 02_MBOX_DOORBELL_LAB's
# doc for why only one of ipm0/mbox0 is ever enabled per lab.

CONFIG_GPIO=y
CONFIG_MBOX=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
