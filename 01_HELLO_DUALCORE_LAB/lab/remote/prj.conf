# 01_HELLO_DUALCORE_LAB - core1 (appcpu) image
#
# No CONFIG_LOG / console here on purpose: Zephyr's UART console driver is
# not yet available on the ESP32-S3 appcpu image, so any log call here
# would either fail to build against a usable backend or simply produce
# no visible output. This core proves itself alive with a GPIO LED only -
# see doc/01_HELLO_DUALCORE_LAB_KR.md section on this limitation.

CONFIG_GPIO=y

# Required even though this lab has no IPC of its own: on this board,
# appcpu is never released from reset unless &ipm0 is enabled on BOTH
# images (confirmed on real hardware - see the troubleshooting doc for
# how this was found). Not used to send/receive anything here.
CONFIG_IPM=y
CONFIG_ESP32_SOFT_IPM=y
