# 02_MBOX_DOORBELL_LAB - core1 (appcpu) image
#
# No CONFIG_LOG / console here on purpose - see 01_HELLO_DUALCORE_LAB's
# doc for why (no UART console support on the appcpu image in Zephyr yet).
# This core proves itself alive with its heartbeat LED, and reacts
# visibly (a fast triple-flash) whenever a doorbell arrives from procpu.
#
# NOTE: &ipm0 is intentionally left DISABLED here - see prj.conf in the
# procpu app for why (&mbox0 alone is enough to release appcpu from reset,
# confirmed on real hardware).

CONFIG_GPIO=y
CONFIG_MBOX=y
