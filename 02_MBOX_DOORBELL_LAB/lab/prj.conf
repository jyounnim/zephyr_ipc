# 02_MBOX_DOORBELL_LAB - core0 (procpu) image
#
# This lab's real teaching content: the MBOX API (mbox.h), used purely as
# a signal-only doorbell (mbox_send_dt(..., NULL) - no payload) in both
# directions between procpu and appcpu.
#
# NOTE: &ipm0 is intentionally left DISABLED here. &ipm0 and &mbox0 are two
# different Zephyr driver bindings for the exact same underlying hardware
# (see doc) - enabling &mbox0 alone is enough to release appcpu from reset,
# confirmed on real hardware, so &ipm0 is left off to avoid two drivers
# competing for the same interrupt sources. Every dual-core/IPC lab in this
# series enables whichever of ipm0/mbox0 matches what it actually teaches.

CONFIG_GPIO=y
CONFIG_MBOX=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
