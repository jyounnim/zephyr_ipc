# sysbuild.conf - sysbuild's OWN Kconfig namespace (SB_CONFIG_*), not the
# app's prj.conf.
#
# Espressif boards default to building MCUboot alongside the app whenever
# --sysbuild is used. This lab has nothing to do with OTA/firmware
# upgrades - it's a plain two-image AMP build (procpu + appcpu) - so
# MCUboot is unwanted overhead here.
#
# SB_CONFIG_BOOTLOADER is a Kconfig *choice* (single-select), and
# Espressif's board-level Kconfig.sysbuild defaults it to
# BOOTLOADER_MCUBOOT. Explicitly selecting BOOTLOADER_NONE=y is what
# actually turns MCUboot off.
SB_CONFIG_BOOTLOADER_NONE=y
SB_CONFIG_BOOTLOADER_MCUBOOT=n
