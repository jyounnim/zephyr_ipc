# 04_IPC_SERVICE_ICMSG_LAB - core0 (procpu) image
#
# This lab's real teaching content: replacing Lab 03's raw MBOX + hand-rolled
# shared struct with Zephyr's IPC Service framework (icmsg backend). See the
# doc for the full devicetree/API design and why this fixes the data-loss
# problem Lab 03 deliberately demonstrated.
#
# CONFIG_IPC_SERVICE_BACKEND_ICMSG defaults to y automatically once the
# devicetree has an enabled "zephyr,ipc-icmsg" node (see lab/boards/*.overlay),
# so it does not need to be set explicitly here - CONFIG_MBOX is still needed
# because icmsg uses MBOX internally as its notification "kick".
#
# NOTE: &ipm0 is intentionally left DISABLED - see 02_MBOX_DOORBELL_LAB's doc
# for why only one of ipm0/mbox0 is ever enabled per lab.

CONFIG_GPIO=y
CONFIG_MBOX=y
CONFIG_IPC_SERVICE=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
