# 01_HELLO_DUALCORE_LAB - core0 (procpu) image
#
# This core has full UART console support, so it proves itself alive two
# ways: a blinking LED (same signal core1 has to rely on exclusively) and
# a logged heartbeat message over the console UART.

CONFIG_GPIO=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Required even though this lab has no IPC of its own: on this board,
# appcpu is never released from reset unless &ipm0 is enabled on BOTH
# images (confirmed on real hardware - see the troubleshooting doc for
# how this was found). Not used to send/receive anything here.
CONFIG_IPM=y
CONFIG_ESP32_SOFT_IPM=y
